name = "rorraxy"
pages_build_output_dir = "."
compatibility_date = "2026-10-24"

# ==========================================
# 1. Cloudflare D1 Database Configuration
# ==========================================
[[d1_databases]]
binding = "DB"
database_name = "rorraxy-db"
database_id = "your_d1_database_id_here"

# ==========================================
# 2. Cloudflare R2 Object Storage Configuration
# ==========================================
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rorraxy-media-storage"

# ==========================================
# 3. Environment Variables (Non-secret)
# ==========================================
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://rorraxy.com"
